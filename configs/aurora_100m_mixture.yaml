model:
  vocab_size: 32768
  d_model: 512
  n_layers: 6
  n_levels: 4
  d_state: 128
  memory_heads: 4
  memory_decay_init: 0.9
  memory_write_init: 0.5
  n_experts: 8
  top_k: 2
  expert_hidden: 1024
  aux_loss_coef: 0.01
  router_z_loss_coef: 0.001
  memory_loss_coef: 0.01
  consistency_loss_coef: 0.01
  dropout: 0.0
  layer_scale_init: 0.1
  tie_embeddings: true

training:
  train_paths:
    - data/processed/ru/train.bin
    - data/processed/en/train.bin
    - data/processed/code/train.bin
  train_weights: [0.6, 0.3, 0.1]
  val_path: data/processed/val.bin
  seq_len: 512
  dtype: uint16
  document_reset: true
  batch_size: 4
  grad_accum_steps: 8
  max_steps: 100000
  warmup_steps: 1000
  min_lr_ratio: 0.1
  learning_rate: 0.0003
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 500
  eval_batches: 20
  log_interval: 10
  save_interval: 1000
  output_dir: runs/aurora_100m_mixture
  device: auto
  dtype_amp: auto
  qat_enabled: false
