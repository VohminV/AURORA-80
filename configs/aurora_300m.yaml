model:
  vocab_size: 32768
  d_model: 768
  n_layers: 7
  n_levels: 4
  d_state: 128
  memory_heads: 8
  n_experts: 12
  top_k: 2
  expert_hidden: 1280
  aux_loss_coef: 0.01
  router_z_loss_coef: 0.001
  memory_loss_coef: 0.01
  consistency_loss_coef: 0.01
  dropout: 0.0
  layer_scale_init: 0.1
  tie_embeddings: true

training:
  train_path: data/processed/train.bin
  val_path: data/processed/val.bin
  seq_len: 512
  dtype: uint16
  document_reset: true
  batch_size: 2
  grad_accum_steps: 16
  max_steps: 375000
  warmup_steps: 2000
  min_lr_ratio: 0.1
  learning_rate: 0.0003
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 2000
  eval_batches: 20
  log_interval: 10
  save_interval: 5000
  output_dir: runs/aurora_300m
  device: auto
  dtype_amp: auto
  gradient_checkpointing: true
