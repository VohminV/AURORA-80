model:
  vocab_size: 65536
  d_model: 1024
  n_layers: 12
  n_levels: 4
  d_state: 256
  memory_heads: 8
  n_experts: 10
  top_k: 2
  expert_hidden: 2048
  aux_loss_coef: 0.01
  router_z_loss_coef: 0.001
  dropout: 0.0
  tie_embeddings: true

training:
  train_path: data/processed_1b/train.bin
  val_path: data/processed_1b/val.bin
  seq_len: 1024
  dtype: uint16
  document_reset: true
  batch_size: 1
  grad_accum_steps: 32
  max_steps: 200000
  warmup_steps: 2000
  learning_rate: 0.00025
  weight_decay: 0.1
  eval_interval: 1000
  eval_batches: 20
  log_interval: 10
  save_interval: 2000
  output_dir: runs/aurora_1b
  device: auto
  dtype_amp: auto
  gradient_checkpointing: true
